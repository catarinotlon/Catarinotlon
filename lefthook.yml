pre-commit:
  commands:
    lint-staged:
      run: pnpm exec lint-staged

commit-msg:
  commands:
    conventional:
      run: >-
        grep -qE '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: .+' {1}
        || (echo 'Commit messages must follow Conventional Commits.' && exit 1)
